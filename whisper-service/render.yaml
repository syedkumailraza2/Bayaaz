# Render blueprint for the unified Bayaaz STT service.
# Push this file at the repo root the Render dashboard is pointed at
# (e.g. clone whisper-service/ into its own Render-managed repo).
#
# Render dashboard → New + → Blueprint → pick this repo → it'll
# create a Web Service with the build/start commands below.

services:
  - type: web
    name: bayaaz-stt
    runtime: python
    plan: free                 # bump to 'starter' if cold starts hurt
    region: oregon             # closest to Mongo/Vercel by default
    branch: main
    rootDir: whisper-service   # remove this line if the repo *is* whisper-service
    buildCommand: |
      pip install -r requirements.txt
      bash scripts/fetch-models.sh
    startCommand: uvicorn vosk_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: VOSK_MODEL_PATH
        value: ./model
      - key: VOSK_SAMPLE_RATE
        value: "16000"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "600"           # 10 min — under Render's 15 min idle limit
      # RENDER_EXTERNAL_URL is auto-injected, no need to set it.
