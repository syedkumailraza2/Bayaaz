# Render blueprint for the unified Bayaaz STT service.
# Push this file at the repo root the Render dashboard is pointed at
# (e.g. clone whisper-service/ into its own Render-managed repo).
#
# Render dashboard → New + → Blueprint → pick this repo → it'll
# create a Web Service with the build/start commands below.

services:
  - type: web
    name: bayaaz-stt
    runtime: python
    plan: free                 # bump to 'starter' if cold starts hurt
    region: oregon             # closest to Mongo/Vercel by default
    branch: main
    rootDir: whisper-service   # remove this line if the repo *is* whisper-service
    buildCommand: |
      pip install -r requirements.txt
      bash scripts/fetch-models.sh
    startCommand: uvicorn vosk_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: VOSK_MODEL_PATH
        value: ./model
      - key: VOSK_SAMPLE_RATE
        value: "16000"
      # Keep-alive is DISABLED on free tier: a self-ping every 10 min keeps the
      # service always-on (~730 instance-hours/month), and the free tier's
      # 750h/month cap is shared across ALL free services — two always-on
      # services blow past it and Render *suspends* them mid-month. Letting the
      # service sleep when idle (cold start ~50s on first request) keeps usage
      # well under the cap. Re-enable (delete this / set to "0") only on a paid
      # plan, where there's no instance-hour cap.
      - key: DISABLE_KEEP_ALIVE
        value: "1"
      # RENDER_EXTERNAL_URL is auto-injected, no need to set it.
