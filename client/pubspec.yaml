name: bayaaz
description: "Bayaaz - A Kalaam sharing app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  record: ^5.1.2
  speech_to_text: ^7.0.0
  socket_io_client: ^3.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  app_links: ^6.3.2
  share_plus: ^10.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

# `record 5.2.1` resolves `record_linux 0.7.2`, which doesn't implement
# `startStream` from `record_platform_interface 1.5.0`. Dart's kernel
# snapshot compiles every platform variant regardless of target, so the
# stale Linux variant breaks iOS/Android builds. Pin the fixed version.
dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
